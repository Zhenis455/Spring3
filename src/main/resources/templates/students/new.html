<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Add</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="fragments/nav :: body"></div>

<div class="container mt-3">
    <form th:action="@{/students}" method="post" class="col-6">
        <div class="mb-3">
            <label class="form-label">NAME:</label>
            <input class="form-control" name="name" required>
        </div>
        <div class="mb-3">
            <label class="form-label">SURNAME:</label>
            <input class="form-control" name="surname" required>
        </div>
        <div class="mb-3">
            <label class="form-label">EXAM:</label>
            <input type="number" min="0" max="100" class="form-control" name="exam" required>
        </div>
        <button class="btn btn-success">ADD STUDENT</button>
    </form>
</div>
</body>
</html>
