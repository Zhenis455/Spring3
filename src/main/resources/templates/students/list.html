<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Students</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="fragments/nav :: body"></div>

<div class="container mt-3">
    <table class="table table-hover align-middle">
        <thead>
        <tr>
            <th>ID</th>
            <th>NAME</th>
            <th>SURNAME</th>
            <th>EXAM</th>
            <th>MARK</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="student : ${students}"
            th:classappend="${student.exam} < 50 ? 'table-danger' : ''">
            <td th:text="${student.id}"></td>

            <td th:style="${student.exam} < 50 ? 'color:red;' : ''"
                th:text="${student.name}"></td>

            <td th:text="${student.surname}"></td>
            <td th:text="${student.exam}"></td>
            <td th:text="${student.mark}"></td>
        </tr>
        </tbody>
    </table>

    <a class="btn btn-primary" th:href="@{/students/new}">Add Student</a>
</div>
</body>
</html>
